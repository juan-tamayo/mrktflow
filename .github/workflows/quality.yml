name: Quality
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MRKTFLOW_CI_DATABASE: ephemeral
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, intl, zip, gd, dom
          coverage: pcov
          tools: composer:2.8.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.3'
          cache: npm
      - name: Prepare disposable MySQL
        shell: bash
        run: |
          MYSQL_ROOT_PASSWORD="$(openssl rand -hex 32)"
          echo "::add-mask::$MYSQL_ROOT_PASSWORD"
          export MYSQL_ROOT_PASSWORD
          docker run --detach --name mrktflow-ci --publish 127.0.0.1:33306:3306 \
            --env MYSQL_ROOT_PASSWORD --env MYSQL_ROOT_HOST=% \
            mysql:8.4@sha256:6ea90827b1100f8f2ae306a539f86d2c264a26ed435a2a9f75551dd5c3aeb242 \
            --partial-revokes=ON
          bin/php scripts/ci-environment.php
      - name: Install locked dependencies with reviewed hooks
        run: |
          bin/composer install --no-interaction --prefer-dist --no-scripts --no-plugins
          bin/composer check-platform-reqs
          bin/composer dump-autoload --no-interaction
          bin/npm ci --ignore-scripts
      - name: Static and formatting checks
        run: |
          bin/php vendor/bin/pint --test
          bin/php vendor/bin/phpstan analyse --no-progress
          bin/npm run typecheck
          bin/npm run lint
          bin/npm run format:check
      - name: Tests and production build
        run: |
          bin/php artisan test --coverage-clover=coverage/php.xml
          bin/php scripts/coverage-gate.php
          bin/npm run test:unit -- --run
          bin/npm run build
          bin/npm exec -- playwright install --with-deps chromium
          bin/npm run test:e2e
      - name: Dependency verification
        run: |
          bin/composer audit --locked --no-interaction
          bin/npm audit
          bin/npm audit signatures
      - name: Preserve public-page failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-browser-failures
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove disposable database
        if: always()
        run: docker rm --force mrktflow-ci
