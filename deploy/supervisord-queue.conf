[supervisord]
nodaemon = true
logfile = /dev/stdout
logfile_maxbytes = 0
pidfile = /run/supervisord.pid

; Lanes from bin/worker. The demo exercises outbox (webhooks/receipts intent),
; media (image derivatives) and critical (payments + transactional mail).
; marketing/long-work lanes stay off for the demo footprint.
; worker-identity-mail is the documented consumer for customer challenge mail
; (verification + recovery), which is queued on the database-outbox connection
; under the identity-mail queue (docs/development.md).

[program:worker-outbox]
command = php artisan queue:work database-outbox --queue=outbox --timeout=60 --tries=1 --sleep=1 --max-time=3600
directory = /var/www/html
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:worker-media]
command = php artisan queue:work database-outbox --queue=media --timeout=60 --tries=1 --sleep=1 --max-time=3600
directory = /var/www/html
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:worker-identity-mail]
command = php artisan queue:work database-outbox --queue=identity-mail --timeout=60 --tries=1 --sleep=1 --max-time=3600
directory = /var/www/html
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0

[program:worker-critical]
command = php artisan queue:work database --queue=payments,transactional-mail,default --timeout=60 --tries=3 --sleep=1 --max-time=3600
directory = /var/www/html
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
